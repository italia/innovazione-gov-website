# OpenSearch per lo sviluppo in locale: un nodo solo, senza plugin di
# sicurezza (http, nessuna password), 512 MB di heap. Vale solo per provare
# indicizzazione e ricerca sulla propria macchina: il cluster vero ha TLS e
# credenziali, vedi docker-compose.yml per un assetto equivalente.
#
#   docker compose -f opensearch/docker-compose.dev.yml up -d
#   docker compose -f opensearch/docker-compose.dev.yml --profile dashboards up -d
#   docker compose -f opensearch/docker-compose.dev.yml down        # -v azzera i dati
services:
  opensearch:
    image: opensearchproject/opensearch:3
    container_name: opensearch-dev
    environment:
      - cluster.name=opensearch-dev
      - node.name=opensearch-dev
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-dev-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fs http://localhost:9200/_cluster/health | grep -Eq ''"status":"(green|yellow)"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: opensearch-dashboards-dev
    profiles: ["dashboards"]
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"

volumes:
  opensearch-dev-data:
